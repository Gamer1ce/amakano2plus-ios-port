name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check-public-tree.py
      - run: python -m unittest discover -s tests
      - run: python -m unittest discover -s portkit/tests
      - run: python -m unittest discover -s ios/tests
      - run: node --test tests/runtime.test.mjs
      - name: Check all runtime modules parse
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find runtime -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
  swift-file-boundaries:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p build
      - run: swiftc ios/App/LocalFileRequest.swift ios/App/LocalByteRange.swift ios/tests/LocalFileRequestTests.swift -o build/request-tests
      - run: build/request-tests
